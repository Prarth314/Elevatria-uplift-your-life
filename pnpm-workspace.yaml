packages:
  - src/**/*
# Only the bundler needs a dependency build script. Optional tooling uses prebuilt binaries.
allowBuilds:
  esbuild: true
  "@biomejs/biome": false
  sharp: false

# Security patches for retained tooling dependencies; covered by build/tests.
overrides:
  seroval: ^1.6.8
  postcss: ^8.5.23
  source-map-js: ^1.2.2
  "nanoid@^3": ^3.3.18
  "postcss-selector-parser@^6": ^6.1.5
  "sucrase>glob": ^14.0.2
  lodash: ^4.18.1
  "picomatch@^2": ^2.3.2
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
